
name: Update Market Dashboard

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update market data
        env:
          LME_CU_JSON_URL: ${{ vars.LME_CU_JSON_URL }}
          LME_ZN_JSON_URL: ${{ vars.LME_ZN_JSON_URL }}
          LME_SN_JSON_URL: ${{ vars.LME_SN_JSON_URL }}
          HANA_FX_JSON_URL: ${{ vars.HANA_FX_JSON_URL }}
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Daily market data update"
            git push
          fi
  
